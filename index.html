// ---- render ----
function mount(off,base,amp,col,f){cx.fillStyle=col;cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W+16;x+=16){const u=(x+off)*f;cx.lineTo(x,base-amp*(.55+.3*Math.sin(u)+.15*Math.sin(u*2.7+1)))}cx.lineTo(W+16,H);cx.fill()}

function render(dt){const cam=pos-PZ,bs=T[cl(cam/SEG|0,0,N-2)],bp=(cam%SEG)/SEG,pg=T[cl(pos/SEG|0,0,N-2)],pp=(pos%SEG)/SEG,camY=CH+pg.y1+(pg.y2-pg.y1)*pp,pct=sp/MAXV;

Q(a[0]-a[2],a[0]+a[2],a[1],b[0]-b[2],b[0]+b[2],b[1],s.k?(i%2?'#fff':'#111'):s.rc[par]);
if(!par&&!s.k)for(const o of[-1/3,1/3]){const w1=a[2]/32,w2=b[2]/32;Q(a[0]+a[2]*o-w1,a[0]+a[2]*o+w1,a[1],b[0]+b[2]*o-w2,b[0]+b[2]*o+w2,b[1],'#f8fafc')}
vis.push({s,a,b,cl:cl0});my=a[1]}
g=cx.createLinearGradient(0,hz-H*.04,0,hz+H*.2);g.addColorStop(0,'rgba('+bs.fg.map(Math.round)+',.95)');g.addColorStop(1,'rgba('+bs.fg.map(Math.round)+',0)');cx.fillStyle=g;cx.fillRect(0,hz-H*.04,W,H*.24);
for(let k=vis.length-1;k>=0;k--){const{s,a,b,cl:c0}=vis[k],al=cl(1.15-k/vis.length*.8,.35,1);
for(const p of s.pr){const u=a[3]*W/2*p.s;if(u*3000<3)continue;const X=a[0]+a[3]*(p.o||0)*RW*W/2;
if(p.t=='arch'||X<-u*1500||X>W+u*1500)continue;cx.save();cx.globalAlpha=al;if(c0<a[1]){cx.beginPath();cx.rect(0,0,W,c0);cx.clip()}prop(p.t,X,a[1],u);cx.restore()}

for(const bt of bm[s.i]||[]){const pc=(bt.z%SEG)/SEG,sc=lp(a[3],b[3],pc),X=lp(a[0],b[0],pc)+sc*bt.x*RW*W/2,Y=lp(a[1],b[1],pc),h=sc*W/2*BH;if(h<5)continue;

const nit=S=='race'&&(kb.n||K.n)&&nitro>0&&(kb.u||K.u),h=Math.min(W*.2,H*.46);
if(sp>MAXV*.6||nit){cx.strokeStyle=nit?'rgba(140,210,255,.5)':'rgba(255,255,255,.14)';cx.lineWidth=Math.max(1,H*.003);for(let i=0;i<16;i++){const a=Math.random()*6.283,r=H*(.35+Math.random()*.3);cx.beginPath();cx.moveTo(W/2+Math.cos(a)*r,hz+Math.sin(a)*r*.7);cx.lineTo(W/2+Math.cos(a)*(r+H*.2*pct),hz+Math.sin(a)*(r+H*.2*pct)*.7);cx.stroke()}}
bike(W/2,H*.985-Math.abs(Math.sin(t*28))*pct*h*.012,h,lean,me.col,nit,(kb.d||K.b)&&S=='race',ph);
if(nit){g=cx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.9);g.addColorStop(0,'rgba(56,189,248,0)');g.addColorStop(1,'rgba(56,189,248,.28)');cx.fillStyle=g;cx.fillRect(0,0,W,H)}

function hud(now){const u=H/420,mg=Math.max(W*.045,24*u),r=44*u,gx=mg+r,gy=r+16*u,a0=Math.PI*.75,a1=Math.PI*2.25,v=cl(sp/(MAXV*1.4),0,1);

// ---- loop ----
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||0);last=now;t+=dt;
