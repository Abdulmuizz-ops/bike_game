<script>
"use strict";

/* =========================================================
   BASIC SAFETY
========================================================= */

const $=id=>document.getElementById(id);

let fatal=false;

function fatalError(err){
  if(fatal)return;
  fatal=true;

  console.error(err);

  $("ui").innerHTML=`
    <div class="box">
      <h2>TRAIL RUSH</h2>
      <p class="error">
        ${String(err?.message||err).replace(/[<>&"]/g,"")}
      </p>
      <button class="primary" onclick="location.reload()">
        RELOAD GAME
      </button>
    </div>
  `;
}

window.addEventListener("error",e=>{
  if(e.error)fatalError(e.error);
});

window.addEventListener("unhandledrejection",e=>{
  fatalError(e.reason||"Unknown error");
});

/* =========================================================
   THREE.JS
========================================================= */

if(typeof THREE==="undefined"){
  fatalError("Three.js failed to load. Check your internet connection.");
  throw new Error("Three.js unavailable");
}

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8bb9df);

scene.fog=new THREE.Fog(
  0x8bb9df,
  90,
  700
);

const camera=new THREE.PerspectiveCamera(
  67,
  innerWidth/innerHeight,
  .05,
  1500
);

camera.position.set(
  0,
  3.2,
  -8
);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio||1,1.75)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

renderer.toneMapping=
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.12;

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

$("game").appendChild(
  renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

const hemi=new THREE.HemisphereLight(
  0xc9e8ff,
  0x314c29,
  2.2
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
  0xffffff,
  3.2
);

sun.position.set(
  -100,
  150,
  100
);

sun.castShadow=true;

sun.shadow.mapSize.set(
  1536,
  1536
);

sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;

scene.add(sun);

/* =========================================================
   CONSTANTS
========================================================= */

const ROAD_W=11;
const ROAD_LEN=3600;
const LAP_LEN=1200;
const TOTAL_LAPS=3;

const COLORS=[
  0xef4444,
  0xf59e0b,
  0x22c55e,
  0x06b6d4,
  0x6366f1,
  0xec4899
];

/* =========================================================
   GAME STATE
========================================================= */

let state="menu";
let raceStarted=false;

let speed=0;
let distance=0;
let laneX=0;

let lap=1;

let countdown=0;

const keys={
  gas:false,
  brake:false,
  left:false,
  right:false,
  boost:false
};

function clearKeys(){
  for(const k in keys)
    keys[k]=false;
}

/* =========================================================
   TRACK
========================================================= */

const track=new THREE.Group();

scene.add(track);

function makeTrack(){

  const groundMat=
    new THREE.MeshStandardMaterial({
      color:0x456d37,
      roughness:1
    });

  const ground=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1000,
        5000
      ),
      groundMat
    );

  ground.rotation.x=-Math.PI/2;
  ground.position.y=-.8;
  ground.position.z=1800;

  ground.receiveShadow=true;

  track.add(ground);

  const roadMat=
    new THREE.MeshStandardMaterial({
      color:0x292d31,
      roughness:.95
    });

  const road=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROAD_W,
        ROAD_LEN
      ),
      roadMat
    );

  road.rotation.x=-Math.PI/2;
  road.position.y=-.69;
  road.position.z=ROAD_LEN/2;

  road.receiveShadow=true;

  track.add(road);

  const edgeMat=
    new THREE.MeshStandardMaterial({
      color:0xe8ddaf,
      roughness:.7
    });

  for(const x of [
    -ROAD_W/2+.25,
    ROAD_W/2-.25
  ]){

    const edge=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .13,
          .035,
          ROAD_LEN
        ),
        edgeMat
      );

    edge.position.set(
      x,
      -.63,
      ROAD_LEN/2
    );

    track.add(edge);
  }

  for(let z=0;z<ROAD_LEN;z+=12){

    const line=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .13,
          .035,
          5
        ),
        edgeMat
      );

    line.position.set(
      0,
      -.62,
      z
    );

    track.add(line);
  }

  makeEnvironment();
}

function makeEnvironment(){

  const trunkMat=
    new THREE.MeshStandardMaterial({
      color:0x5c3b27
    });

  const leafMat=
    new THREE.MeshStandardMaterial({
      color:0x1e5b31,
      roughness:1
    });

  const rockMat=
    new THREE.MeshStandardMaterial({
      color:0x6d7477,
      roughness:1
    });

  for(let z=20;z<ROAD_LEN;z+=20){

    for(const side of [-1,1]){

      const x=
        side*
        (10+Math.random()*22);

      const trunk=
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            .18,
            .38,
            4,
            7
          ),
          trunkMat
        );

      trunk.position.set(
        x,
        1,
        z+Math.random()*8
      );

      trunk.castShadow=true;

      track.add(trunk);

      const leaves=
        new THREE.Mesh(
          new THREE.ConeGeometry(
            2.4+Math.random()*1.5,
            5+Math.random()*3,
            8
          ),
          leafMat
        );

      leaves.position.set(
        x,
        5,
        trunk.position.z
      );

      leaves.castShadow=true;

      track.add(leaves);

      if(Math.random()<.55){

        const rock=
          new THREE.Mesh(
            new THREE.DodecahedronGeometry(
              .6+Math.random()*.9
            ),
            rockMat
          );

        rock.position.set(
          side*(7+Math.random()*12),
          -.25,
          z+Math.random()*12
        );

        rock.rotation.set(
          Math.random(),
          Math.random(),
          Math.random()
        );

        rock.scale.y=.6;

        track.add(rock);
      }
    }
  }

  /* Start / finish */

  const finishMat=
    new THREE.MeshStandardMaterial({
      color:0xffffff
    });

  for(let i=-5;i<5;i++){

    const tile=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.1,
          .04,
          2
        ),
        new THREE.MeshStandardMaterial({
          color:
            i%2===0
              ?0xffffff
              :0x111111
        })
      );

    tile.position.set(
      i*1.1,
      -.6,
      15
    );

    track.add(tile);
  }
}

makeTrack();

/* =========================================================
   BIKE / RIDER
========================================================= */

const bikeMeshes={};

function capsule(
  radius,
  length,
  material
){
  return new THREE.Mesh(
    new THREE.CapsuleGeometry(
      radius,
      length,
      5,
      10
    ),
    material
  );
}

function makeBike(color){

  const g=new THREE.Group();

  const paint=
    new THREE.MeshStandardMaterial({
      color,
      roughness:.3,
      metalness:.45
    });

  const dark=
    new THREE.MeshStandardMaterial({
      color:0x11151b,
      roughness:.5,
      metalness:.25
    });

  const metal=
    new THREE.MeshStandardMaterial({
      color:0xaeb8c2,
      roughness:.22,
      metalness:.85
    });

  const skin=
    new THREE.MeshStandardMaterial({
      color:0xb97955,
      roughness:.85
    });

  /* Frame */

  const frame=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .55,
        .32,
        1.25
      ),
      paint
    );

  frame.position.y=.65;
  frame.castShadow=true;

  g.add(frame);

  /* Tank */

  const tank=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .38,
        16,
        10
      ),
      paint
    );

  tank.scale.set(
    .9,
    .65,
    1.2
  );

  tank.position.set(
    0,
    .87,
    -.12
  );

  tank.castShadow=true;

  g.add(tank);

  /* Seat */

  const seat=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .48,
        .15,
        .6
      ),
      dark
    );

  seat.position.set(
    0,
    1.04,
    .35
  );

  g.add(seat);

  /* Wheels */

  const wheelMat=
    new THREE.MeshStandardMaterial({
      color:0x111317,
      roughness:.8
    });

  for(const z of [-.62,.62]){

    const wheel=
      new THREE.Mesh(
        new THREE.TorusGeometry(
          .39,
          .105,
          8,
          20
        ),
        wheelMat
      );

    wheel.rotation.y=Math.PI/2;

    wheel.position.set(
      0,
      .4,
      z
    );

    wheel.castShadow=true;

    wheel.userData.wheel=true;

    g.add(wheel);

    const hub=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .09,
          .09,
          .16,
          12
        ),
        metal
      );

    hub.rotation.z=Math.PI/2;

    hub.position.copy(
      wheel.position
    );

    g.add(hub);
  }

  /* Fork */

  for(const x of [-.14,.14]){

    const fork=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .045,
          .055,
          .7,
          8
        ),
        metal
      );

    fork.rotation.z=
      x<0?.18:-.18;

    fork.position.set(
      x,
      .76,
      -.45
    );

    g.add(fork);
  }

  /* Handlebar */

  const handle=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .035,
        .035,
        .75,
        8
      ),
      dark
    );

  handle.rotation.z=Math.PI/2;

  handle.position.set(
    0,
    1.17,
    -.48
  );

  g.add(handle);

  /* =====================================================
     RIDER
  ===================================================== */

  const torso=capsule(
    .21,
    .43,
    paint
  );

  torso.rotation.x=-.43;
  torso.position.set(
    0,
    1.31,
    -.02
  );

  torso.scale.set(
    1,
    .95,
    .78
  );

  torso.castShadow=true;

  g.add(torso);

  const hip=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .22,
        12,
        8
      ),
      dark
    );

  hip.scale.set(
    1,
    .7,
    1.15
  );

  hip.position.set(
    0,
    1.08,
    .31
  );

  hip.castShadow=true;

  g.add(hip);

  /* Arms */

  for(const side of [-1,1]){

    const upper=
      capsule(
        .065,
        .30,
        paint
      );

    upper.position.set(
      side*.17,
      1.36,
      -.27
    );

    upper.rotation.z=
      side*.42;

    upper.rotation.x=-.62;

    upper.castShadow=true;

    g.add(upper);

    const fore=
      capsule(
        .052,
        .28,
        skin
      );

    fore.position.set(
      side*.19,
      1.19,
      -.48
    );

    fore.rotation.x=-.18;

    fore.castShadow=true;

    g.add(fore);

    const glove=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .075,
          10,
          8
        ),
        dark
      );

    glove.position.set(
      side*.20,
      1.14,
      -.59
    );

    g.add(glove);

    /* Legs */

    const thigh=
      capsule(
        .075,
        .32,
        dark
      );

    thigh.position.set(
      side*.18,
      .98,
      .34
    );

    thigh.rotation.z=
      side*.32;

    thigh.castShadow=true;

    g.add(thigh);

    const shin=
      capsule(
        .06,
        .29,
        dark
      );

    shin.position.set(
      side*.25,
      .73,
      .20
    );

    shin.rotation.x=.25;

    shin.rotation.z=
      side*.18;

    shin.castShadow=true;

    g.add(shin);

    const boot=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .14,
          .13,
          .3
        ),
        dark
      );

    boot.position.set(
      side*.28,
      .61,
      .03
    );

    boot.castShadow=true;

    g.add(boot);
  }

  /* Helmet */

  const helmet=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .235,
        18,
        14
      ),
      dark
    );

  helmet.position.set(
    0,
    1.68,
    -.25
  );

  helmet.castShadow=true;

  g.add(helmet);

  /* Visor */

  const visor=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .145,
        16,
        10
      ),
      new THREE.MeshStandardMaterial({
        color:0x08111a,
        metalness:.8,
        roughness:.1
      })
    );

  visor.scale.set(
    .9,
    .55,
    .35
  );

  visor.position.set(
    0,
    1.69,
    -.44
  );

  g.add(visor);

  /* Headlight */

  const light=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .085,
        12,
        8
      ),
      new THREE.MeshBasicMaterial({
        color:0xffffdf
      })
    );

  light.position.set(
    0,
    1.45,
    -.72
  );

  g.add(light);

  return g;
}

/* =========================================================
   MULTIPLAYER
========================================================= */

let peer=null;
let host=false;
let roomCode="";
let connections=[];
let players={};

let myId="local";

const playerName=
  localStorage.getItem("trail_name")||
  "Rider";

let myName=playerName;
let myColor=
  Number(localStorage.getItem("trail_color")||0);

function createRoomCode(){

  const chars=
    "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

  let code="";

  for(let i=0;i<5;i++)
    code+=chars[
      Math.floor(
        Math.random()*chars.length
      )
    ];

  return code;
}

function broadcast(data){

  for(const c of connections){

    if(c&&c.open){

      try{
        c.send(data);
      }catch{}
    }
  }
}

function startHost(){

  host=true;

  roomCode=
    createRoomCode();

  peer=new Peer(
    "trail-rush-"+roomCode
  );

  peer.on("open",()=>{
    players={};

    players[myId]={
      id:myId,
      name:myName,
      color:myColor,
      d:0,
      x:0,
      v:0,
      connected:true
    };

    showLobby();
  });

  peer.on("connection",conn=>{

    conn.on("open",()=>{

      if(
        Object.keys(players).length>=6
      ){
        conn.send({
          type:"full"
        });
        conn.close();
        return;
      }

      conn.on("data",data=>{
        hostReceive(conn,data);
      });

      conn.on("close",()=>{

        if(conn.playerId){

          delete players[
            conn.playerId
          ];

          broadcast({
            type:"players",
            players
          });

          if(state==="lobby")
            showLobby();
        }

        connections=
          connections.filter(
            c=>c!==conn
          );
      });
    });
  });

  peer.on("error",e=>{
    console.error(e);

    if(e.type==="unavailable-id"){
      peer.destroy();
      startHost();
    }else{
      showError(
        "Multiplayer connection error: "+
        e.type
      );
    }
  });
}

function hostReceive(conn,data){

  if(!data)return;

  if(data.type==="join"){

    const id=
      "p"+
      Math.random()
        .toString(36)
        .slice(2,8);

    conn.playerId=id;

    players[id]={
      id,
      name:
        String(data.name||"Rider")
          .slice(0,12),
      color:
        Number(data.color||0)%6,
      d:0,
      x:0,
      v:0,
      connected:true
    };

    connections.push(conn);

    conn.send({
      type:"welcome",
      id,
      players,
      room:roomCode
    });

    broadcast({
      type:"players",
      players
    });

    showLobby();

    return;
  }

  if(data.type==="state"){

    const p=
      players[conn.playerId];

    if(!p)return;

    p.d=Number(data.d)||0;
    p.x=Number(data.x)||0;
    p.v=Number(data.v)||0;

    return;
  }

  if(data.type==="ready"){
    broadcast({
      type:"ready"
    });
  }
}

function joinRoom(code){

  roomCode=code;

  host=false;

  peer=new Peer();

  peer.on("open",()=>{

    const conn=
      peer.connect(
        "trail-rush-"+code,
        {reliable:true}
      );

    hc=conn;

    conn.on("open",()=>{

      conn.send({
        type:"join",
        name:myName,
        color:myColor
      });
    });

    conn.on("data",clientReceive);

    conn.on("close",()=>{
      showError(
        "The host disconnected."
      );
    });
  });

  peer.on("error",e=>{
    console.error(e);

    showError(
      "Could not join room "+code
    );
  });
}

let hc=null;

function clientReceive(data){

  if(!data)return;

  if(data.type==="full"){
    showError("Room is full.");
    return;
  }

  if(data.type==="welcome"){

    myId=data.id;

    players=data.players||{};

    roomCode=data.room;

    showLobby();

    return;
  }

  if(data.type==="players"){

    players=data.players||{};

    if(state==="lobby")
      showLobby();

    return;
  }

  if(data.type==="start"){

    players=data.players||players;

    beginRace();

    return;
  }

  if(data.type==="state"){

    players=data.players||players;

    return;
  }
}

/* =========================================================
   LOBBY
========================================================= */

function showLobby(){

  state="lobby";

  const list=
    Object.values(players)
      .map(p=>
        `<div style="
          padding:8px;
          margin:4px 0;

  $("ui").innerHTML=`
    <div class="box">

      <div class="sub">
        SHARE THIS CODE
      </div>

      <div style="
        font-size:42px;
        font-weight:1000;
        letter-spacing:8px;
        color:#ffd166;
        margin:12px 0 22px">
        ${roomCode}
      </div>

      <div>
        ${list}
      </div>

      ${
        host
        ?`
          <button
            class="primary"
            id="startOnline"
          >
            START RACE

        `
        :`
          <div class="hint">
            Waiting for the host to start...

  $("leave").onclick=()=>{

/* =========================================================
   RACE
========================================================= */

function beginRace(){

  state="count";

  raceStarted=true;

  clearKeys();

  distance=0;
  speed=0;
  laneX=0;
  lap=1;

  for(const id in players){

    if(id===myId)continue;

    players[id].d=0;
    players[id].x=
      ((Object.keys(players).indexOf(id)%5)-2)
      *.9;

    players[id].v=0;
  }

  $("ui").innerHTML="";

  countdown=3;

  $("count").textContent="3";

  const timer=setInterval(()=>{

    countdown--;

    if(countdown>0){

      $("count").textContent=
        countdown;

    }else{

      clearInterval(timer);

      $("count").textContent="GO!";

      setTimeout(()=>{
        $("count").textContent="";
      },700);

      state="race";
    }

  },1000);
}

/* =========================================================
   CONTROLS
========================================================= */

const keyMap={
  ArrowUp:"gas",
  KeyW:"gas",

  ArrowDown:"brake",
  KeyS:"brake",

  ArrowLeft:"left",
  KeyA:"left",

  ArrowRight:"right",
  KeyD:"right",

  ShiftLeft:"boost",
  ShiftRight:"boost",
  Space:"boost"
};

window.addEventListener(
  "keydown",
  e=>{

    const action=
      keyMap[e.code];

    if(!action)return;

    const tag=
      document.activeElement?.tagName;

    if(
      tag==="INPUT"||
      tag==="TEXTAREA"||
      tag==="SELECT"
    )
      return;

    if(
      state==="race"||
      state==="count"
    ){

      keys[action]=true;

      e.preventDefault();
    }
  },
  {passive:false}
);

window.addEventListener(
  "keyup",
  e=>{

    const action=
      keyMap[e.code];

    if(!action)return;

    keys[action]=false;

    e.preventDefault();

  },
  {passive:false}
);

window.addEventListener(
  "blur",
  clearKeys
);

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden)
      clearKeys();
  }
);

/* Mobile controls */

for(const button of
  document.querySelectorAll(".mbtn")
){

  const action=button.dataset.key;

  const down=e=>{
    e.preventDefault();
    keys[action]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[action]=false;
  };

  button.addEventListener(
    "pointerdown",
    down
  );

  button.addEventListener(
    "pointerup",
    up
  );

  button.addEventListener(
    "pointercancel",
    up
  );

  button.addEventListener(
    "pointerleave",
    up
  );
}

/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(dt){

  if(state!=="race")
    return;

  const accelerating=
    keys.gas;

  const braking=
    keys.brake;

  const boost=
    keys.boost &&
    accelerating &&
    speed>25;

  if(accelerating){

    speed+=
      (
        boost
        ?48
        :24
      )*dt;

  }else{

    speed-=
      10*dt;
  }

  if(braking)
    speed-=38*dt;

  speed=
    Math.max(
      0,
      Math.min(
        boost?145:105,
        speed
      )
    );

  let steer=0;

  if(keys.left)
    steer--;

  if(keys.right)
    steer++;

  const steeringPower=
    (6+speed*.045)*dt;

  laneX+=
    steer*
    steeringPower;

  laneX=
    THREE.MathUtils.clamp(
      laneX,
      -4.2,
      4.2
    );

  distance+=
    speed*dt;

  const totalDistance=
    LAP_LEN*TOTAL_LAPS;

  if(distance>=totalDistance){

    distance=totalDistance;

    state="finished";

    clearKeys();

    showFinish();

    return;
  }

  lap=
    Math.min(
      TOTAL_LAPS,
      Math.floor(
        distance/LAP_LEN
      )+1
    );

  $("speedNum").textContent=
    Math.round(speed);

  $("lap").textContent=
    `LAP ${lap} / ${TOTAL_LAPS}`;

  if(roomCode)
    $("room").textContent=
      `ROOM ${roomCode}`;

  /* Local player */

  players[myId]=players[myId]||{};

  players[myId].d=distance;
  players[myId].x=laneX;
  players[myId].v=speed;
}

/* =========================================================
   BIKE VISUALS
========================================================= */

function getBike(id,color){

  if(!bikeMeshes[id]){

    const bike=
      makeBike(
        COLORS[color%COLORS.length]
      );

    bikeMeshes[id]=bike;

    scene.add(bike);
  }

  return bikeMeshes[id];
}

function updateBikeMeshes(){

  const ids=
    Object.keys(players);

  ids.forEach((id,index)=>{

    const p=players[id];

    if(!p)return;

    const bike=
      getBike(
        id,
        p.color||0
      );

    let z=
      p.d;

    /* Keep every rider near the camera.
       This creates an endless-road effect. */

    const relative=
      p.d-distance;

    z=
      8+relative*.55;

    if(id===myId){

      bike.position.set(
        laneX,
        0,
        5
      );

      bike.rotation.y=
        THREE.MathUtils.lerp(
          bike.rotation.y,
          (
            keys.left
              ?-.16
              :keys.right
                ?.16
                :0
          ),
          .12
        );

    }else{

      bike.position.set(
        p.x||0,
        0,
        z
      );

      bike.rotation.y=
        THREE.MathUtils.lerp(
          bike.rotation.y,
          0,
          .08
        );
    }

    /* Hide riders too far away */

    bike.visible=
      id===myId||
      (
        relative>-70&&
        relative<150
      );

    /* Wheel animation */

    bike.traverse(obj=>{

      if(
        obj.userData&&
        obj.userData.wheel
      ){

        obj.rotation.x+=
          (p.v||0)*.035;
      }
    });
  });

  /* Remove disconnected riders */

  for(const id in bikeMeshes){

    if(!players[id]){

      scene.remove(
        bikeMeshes[id]
      );

      delete bikeMeshes[id];
    }
  }
}

/* =========================================================
   CAMERA
========================================================= */

const camTarget=
  new THREE.Vector3();

function updateCamera(dt){

  const targetX=
    laneX*.55;

  camera.position.x=
    THREE.MathUtils.lerp(
      camera.position.x,
      targetX,
      1-Math.pow(.001,dt)
    );

  camera.position.y=
    THREE.MathUtils.lerp(
      camera.position.y,
      3.05+
      speed*.006,
      .08
    );

  camera.position.z=
    THREE.MathUtils.lerp(
      camera.position.z,
      -8,
      .1
    );

  camTarget.set(
    laneX,
    1.05,
    18+speed*.08
  );

  camera.lookAt(
    camTarget
  );
}

/* =========================================================
   NETWORK UPDATE
========================================================= */

let networkTimer=0;

function networkUpdate(dt){

  if(
    !roomCode||
    state!=="race"
  )
    return;

  networkTimer+=dt;

  if(networkTimer<.08)
    return;

  networkTimer=0;

  const packet={
    type:"state",
    d:distance,
    x:laneX,
    v:speed
  };

  if(host){

    players[myId].d=distance;
    players[myId].x=laneX;
    players[myId].v=speed;

    broadcast({
      type:"state",
      players
    });

  }else if(hc&&hc.open){

    try{
      hc.send(packet);
    }catch{}
  }
}

/* =========================================================
   FINISH
========================================================= */

function showFinish(){

  $("ui").innerHTML=`
    <div class="box">
      <h1 class="title">FINISH!</h1>
      <div class="sub">
        RACE COMPLETED
      </div>

      <div style="
        font-size:22px;
        font-weight:900;
        margin:18px">
        SPEED ${Math.round(speed)} KM/H
      </div>

      <button
        class="primary"
        id="again"
      >
        RACE AGAIN
      </button>

      <button id="menu">
        MAIN MENU
      </button>
    </div>
  `;

  $("again").onclick=()=>{
    beginRace();
  };

  $("menu").onclick=()=>{
    for(const id in bikeMeshes){
      scene.remove(
        bikeMeshes[id]
      );
      delete bikeMeshes[id];
    }

    showMenu();
  };
}

/* =========================================================
   MAIN LOOP
========================================================= */

let previous=performance.now();

function animate(now){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      .033,
      Math.max(
        0,
        (now-previous)/1000
      )
    );

  previous=now;

  if(
    state==="race"
  ){

    updatePlayer(dt);
    networkUpdate(dt);
  }

  /* Smooth remote-player prediction */

  if(state==="race"){

    for(const id in players){

      if(id===myId)continue;

      const p=players[id];

      if(!p)continue;

      p.d+=
        (p.v||0)*
        dt*
        .95;
    }
  }

  updateBikeMeshes();
  updateCamera(dt);

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* =========================================================
   INTRO
========================================================= */

setTimeout(()=>{

  const intro=$("intro");

  intro.style.transition=
    "opacity .8s ease";

  intro.style.opacity="0";

  setTimeout(()=>{
    intro.remove();
    showMenu();
  },800);

},3600);

/* =========================================================
   START
========================================================= */

showMenu();

requestAnimationFrame(
  animate
);

</script>
</body>
